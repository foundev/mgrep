name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          go build -o dist/mgrep .
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mgrep
